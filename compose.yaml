services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collegium
      POSTGRES_USER: collegium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collegium}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "collegium", "-d", "collegium"]
      interval: 2s
      retries: 30

  # One-shot: applies pending migrations, then exits.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://collegium:${POSTGRES_PASSWORD:-collegium}@db:5432/collegium?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db:ro
    command: ["--wait", "up"]
    depends_on:
      db:
        condition: service_healthy

  # One-shot: creates or updates the worker and board login users.
  logins:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: collegium
      PGDATABASE: collegium
      PGPASSWORD: ${POSTGRES_PASSWORD:-collegium}
    volumes:
      - ./db:/db:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - worker_password=${COLLEGIUM_WORKER_PASSWORD:-worker}
      - -v
      - board_password=${COLLEGIUM_BOARD_PASSWORD:-board}
      - -f
      - /db/logins.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Backs up the database every BACKUP_INTERVAL_HOURS into COLLEGIUM_BACKUP_DIR.
  # One-off: docker compose run --rm backup sh /db/backup.sh
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: collegium
      PGDATABASE: collegium
      PGPASSWORD: ${POSTGRES_PASSWORD:-collegium}
      BACKUP_INTERVAL_HOURS: ${COLLEGIUM_BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${COLLEGIUM_BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./db:/db:ro
      - ${COLLEGIUM_BACKUP_DIR:-./backups}:/backups
    command: ["sh", "/db/backup.sh", "--loop"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["collegium", "worker"]
    environment:
      COLLEGIUM_WORKER_DATABASE_URL: postgresql://collegium_worker_app:${COLLEGIUM_WORKER_PASSWORD:-worker}@db:5432/collegium
      # The model runs on the host (e.g. Ollama with GPU access).
      COLLEGIUM_LLM_BASE_URL: ${COLLEGIUM_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      COLLEGIUM_LLM_MODEL: ${COLLEGIUM_LLM_MODEL:-qwen3:14b}
      COLLEGIUM_LLM_MAX_TOKENS: ${COLLEGIUM_LLM_MAX_TOKENS:-2048}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Free search first; Tavily is the fallback.
      COLLEGIUM_SEARXNG_URL: http://searxng:8080
      # Paid calls per 24 hours; keep 30 x days-per-month within the plan.
      COLLEGIUM_DAILY_CALL_BUDGET: ${COLLEGIUM_DAILY_CALL_BUDGET:-50}
      COLLEGIUM_SCOUT_RECENT_DAYS: ${COLLEGIUM_SCOUT_RECENT_DAYS:-30}
      COLLEGIUM_MAX_FEED_ITEMS: ${COLLEGIUM_MAX_FEED_ITEMS:-5}
      # Jobs start only within working hours; see the scheduler for the same.
      COLLEGIUM_WORK_HOURS: ${COLLEGIUM_WORK_HOURS:-08:00-16:00}
      COLLEGIUM_WORK_DAYS: ${COLLEGIUM_WORK_DAYS:-mon-fri}
      COLLEGIUM_TIMEZONE: ${COLLEGIUM_TIMEZONE:-Europe/Oslo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # On a stop or recreate the worker finishes its current job first; model
    # jobs run for minutes, and a job cut off loses its work and an attempt.
    stop_grace_period: 20m
    depends_on:
      logins:
        condition: service_completed_successfully
      searxng:
        condition: service_started

  scheduler:
    build: .
    command: ["collegium", "scheduler"]
    environment:
      COLLEGIUM_WORKER_DATABASE_URL: postgresql://collegium_worker_app:${COLLEGIUM_WORKER_PASSWORD:-worker}@db:5432/collegium
      COLLEGIUM_WORK_HOURS: ${COLLEGIUM_WORK_HOURS:-08:00-16:00}
      COLLEGIUM_WORK_DAYS: ${COLLEGIUM_WORK_DAYS:-mon-fri}
      COLLEGIUM_TIMEZONE: ${COLLEGIUM_TIMEZONE:-Europe/Oslo}
    restart: unless-stopped
    depends_on:
      logins:
        condition: service_completed_successfully

  # The board. It has no login yet, so it is published on localhost only.
  web:
    build: .
    command: ["collegium", "web", "--host", "0.0.0.0"]
    environment:
      COLLEGIUM_BOARD_DATABASE_URL: postgresql://collegium_board_app:${COLLEGIUM_BOARD_PASSWORD:-board}@db:5432/collegium
      COLLEGIUM_SEARXNG_URL: http://searxng:8080
      COLLEGIUM_DAILY_CALL_BUDGET: ${COLLEGIUM_DAILY_CALL_BUDGET:-50}
      COLLEGIUM_WORK_HOURS: ${COLLEGIUM_WORK_HOURS:-08:00-16:00}
      COLLEGIUM_WORK_DAYS: ${COLLEGIUM_WORK_DAYS:-mon-fri}
      COLLEGIUM_TIMEZONE: ${COLLEGIUM_TIMEZONE:-Europe/Oslo}
    ports:
      - "127.0.0.1:${COLLEGIUM_WEB_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      logins:
        condition: service_completed_successfully

  # The organization's own metasearch engine: free search without a quota.
  # Published on localhost only, for the CLI on the host.
  searxng:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-collegium-local-only}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${COLLEGIUM_SEARXNG_PORT:-8888}:8080"
    restart: unless-stopped

volumes:
  db-data:
