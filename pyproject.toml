[project]
name = "collegium"
version = "0.1.0"
description = "A persistent digital research organization with institutional memory."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "trafilatura>=2.2.0",
    "truststore>=0.10.4",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
]

[project.scripts]
collegium = "collegium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collegium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
