# SearXNG for Collegium: the organization's own metasearch, used by the
# worker through its JSON API. Only reachable from localhost (compose.yaml).
use_default_settings: true

general:
  instance_name: "Collegium search"

server:
  # Set through SEARXNG_SECRET in compose.yaml.
  secret_key: "set-by-environment"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  formats:
    - html
    - json
  # A blocked engine is left alone for a while rather than asked again.
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 1800

# More engines, so that no single site sees every query and blocks it (by
# default only Brave, DuckDuckGo and Google CSE answer web queries here, and
# all three blocked the organization on 2026-09-25). Startpage stays off: it
# asks for a proof-of-work captcha.
engines:
  - name: bing
    disabled: false
  - name: mojeek
    inactive: false
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
